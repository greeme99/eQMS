[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eqms-backend"
version = "0.1.0"
description = "Regulatory-Compliant eQMS Backend Service (FDA 21 CFR Part 11 / ISO 13485:2016)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "eQMS Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "httpx>=0.27.0",
    "minio>=7.2.5",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
